[workspace]
resolver = "3"
members = ["crates/core", "crates/player", "crates/service", "crates/desktop"]
default-members = ["crates/service", "crates/desktop"]

[workspace.package]
version = "0.3.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
zbus = "5.19"
libc = "0.2"
overtone-core = { path = "crates/core" }
overtone-player = { path = "crates/player" }
overtone-service = { path = "crates/service" }

[profile.release]
strip = true
opt-level = "s"
codegen-units = 16

[profile.dev]
debug = 0
