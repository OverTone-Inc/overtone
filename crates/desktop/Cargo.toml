[package]
name = "overtone-desktop"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
libc.workspace = true
overtone-core.workspace = true
overtone-player.workspace = true
overtone-service.workspace = true
gtk = { package = "gtk4", version = "0.11", features = ["v4_10"] }
async-channel = "2"
x11rb = { version = "0.13", features = ["randr"] }
gdk4-x11 = "0.11"
ureq = "3"

[[bin]]
name = "overtone"
path = "src/main.rs"
